<div class="special-notebook">

    <!-- =====================================================
         LAB & EXPERIMENTS INTRO
         ===================================================== -->

    <div class="workspace-intro">

        <span class="workspace-icon">
            🧪
        </span>

        <div>

            <h2>
                Lab & Experiments
            </h2>

            <p>
                Record variables, observations, measurements,
                results and conclusions.
            </p>

        </div>

    </div>


    <!-- =====================================================
         EXPERIMENT DETAILS
         ===================================================== -->

    <div class="theory-grid">


        <!-- Aim -->

        <section class="special-card">

            <div class="special-card-header">

                🎯

                <strong>
                    Aim
                </strong>

            </div>

            <textarea
                data-note-field="aim"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- Variables / Setup -->

        <section class="special-card">

            <div class="special-card-header">

                ⚙️

                <strong>
                    Variables / Setup
                </strong>

            </div>

            <textarea
                data-note-field="setup"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- Procedure -->

        <section class="special-card">

            <div class="special-card-header">

                🔬

                <strong>
                    Procedure
                </strong>

            </div>

            <textarea
                data-note-field="procedure"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- Observations / Results -->

        <section class="special-card">

            <div class="special-card-header">

                📈

                <strong>
                    Observations / Results
                </strong>

            </div>

            <textarea
                data-note-field="results"
                class="special-textarea"
            ></textarea>

        </section>

    </div>


    <!-- =====================================================
         CONCLUSION
         ===================================================== -->

    <section class="special-card answer-card">

        <div class="special-card-header">

            ✅

            <strong>
                Conclusion
            </strong>

        </div>

        <textarea
            data-note-field="content"
            class="special-textarea"
        >{{ page_data.content }}</textarea>

    </section>

</div>
