<div class="special-notebook theory-notebook">

    <div class="workspace-intro">

        <span class="workspace-icon">
            📚
        </span>

        <div>

            <h2>
                Theory Notes
            </h2>

            <p>
                Turn complicated concepts into simple explanations.
            </p>

        </div>

    </div>


    <section class="special-card">

        <div class="special-card-header">
            <span>📌</span>
            <strong>Definition</strong>
        </div>

        <textarea
            name="content"
            class="special-textarea"
            placeholder="Write the main definition..."
        >{{ selected_page.content or "" }}</textarea>

    </section>


    <div class="theory-grid">

        <section class="special-card">

            <div class="special-card-header">
                <span>💡</span>
                <strong>Key Concepts</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Important concepts..."
            ></textarea>

        </section>


        <section class="special-card">

            <div class="special-card-header">
                <span>🧠</span>
                <strong>Explanation</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Explain this in your own words..."
            ></textarea>

        </section>

    </div>


    <section class="special-card">

        <div class="special-card-header">
            <span>⭐</span>
            <strong>Important Points</strong>
        </div>

        <textarea
            class="special-textarea"
            placeholder="Things you absolutely need to remember..."
        ></textarea>

    </section>


    <div class="theory-grid">

        <section class="special-card warning-card">

            <div class="special-card-header">
                <span>⚠️</span>
                <strong>Don't Forget</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Common mistakes or confusing points..."
            ></textarea>

        </section>


        <section class="special-card question-card">

            <div class="special-card-header">
                <span>❓</span>
                <strong>Possible Questions</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Exam questions you might get..."
            ></textarea>

        </section>

    </div>


    <section class="special-card summary-card">

        <div class="special-card-header">
            <span>📝</span>
            <strong>Quick Summary</strong>
        </div>

        <textarea
            class="special-textarea"
            placeholder="Summarize the whole topic in a few lines..."
        ></textarea>

    </section>

</div>
