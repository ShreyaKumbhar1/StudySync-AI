<div class="special-notebook general-notebook">

    <div class="workspace-intro">

        <span class="workspace-icon">
            📝
        </span>

        <div>

            <h2>
                Freeform Notes
            </h2>

            <p>
                Write whatever your brain needs to remember.
            </p>

        </div>

    </div>


    <section class="general-editor-card">

        <textarea
            name="content"
            id="generalEditor"
            class="general-editor"
            placeholder="Start writing..."
        >{{ selected_page.content or "" }}</textarea>

    </section>


    <div class="general-tools">

        <button type="button">
            B
        </button>

        <button type="button">
            I
        </button>

        <button type="button">
            U
        </button>

        <button type="button">
            • List
        </button>

        <button type="button">
            ✓ Checklist
        </button>

    </div>

</div>
