<div class="special-notebook project-notebook">

    <div class="workspace-intro">

        <span class="workspace-icon">
            🚀
        </span>

        <div>

            <h2>
                Project & Research
            </h2>

            <p>
                Turn ideas into something real.
            </p>

        </div>

    </div>


    <div class="project-grid">


        <section class="special-card">

            <div class="special-card-header">
                <span>🎯</span>
                <strong>Objective</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="What are you trying to achieve?"
            ></textarea>

        </section>


        <section class="special-card">

            <div class="special-card-header">
                <span>💡</span>
                <strong>Ideas</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Ideas, possibilities and experiments..."
            ></textarea>

        </section>


        <section class="special-card">

            <div class="special-card-header">
                <span>🔬</span>
                <strong>Research</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Research notes..."
            ></textarea>

        </section>


        <section class="special-card">

            <div class="special-card-header">
                <span>🐛</span>
                <strong>Problems</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Problems, bugs and things to solve..."
            ></textarea>

        </section>


        <section class="special-card full-width">

            <div class="special-card-header">
                <span>📝</span>
                <strong>Main Notes</strong>
            </div>

            <textarea
                name="content"
                class="special-textarea project-main-editor"
                placeholder="Write your main project notes..."
            >{{ selected_page.content or "" }}</textarea>

        </section>


        <section class="special-card full-width">

            <div class="special-card-header">
                <span>🔗</span>
                <strong>References</strong>
            </div>

            <textarea
                class="special-textarea"
                placeholder="Useful links, books, papers or resources..."
            ></textarea>

        </section>

    </div>

</div>
