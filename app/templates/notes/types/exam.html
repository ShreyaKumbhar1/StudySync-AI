<div class="special-notebook">

    <!-- =====================================================
         EXAM PREP INTRO
         ===================================================== -->

    <div class="workspace-intro">

        <span class="workspace-icon">
            🎯
        </span>

        <div>

            <h2>
                Exam Prep
            </h2>

            <p>
                Turn the syllabus into an actionable revision system.
            </p>

        </div>

    </div>


    <!-- =====================================================
         EXAM PREPARATION GRID
         ===================================================== -->

    <div class="theory-grid">


        <!-- Syllabus -->

        <section class="special-card">

            <div class="special-card-header">

                📋

                <strong>
                    Syllabus / Topics
                </strong>

            </div>

            <textarea
                data-note-field="syllabus"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- High Priority -->

        <section class="special-card">

            <div class="special-card-header">

                🔥

                <strong>
                    High Priority
                </strong>

            </div>

            <textarea
                data-note-field="priority"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- Important Questions -->

        <section class="special-card">

            <div class="special-card-header">

                ❓

                <strong>
                    Important Questions
                </strong>

            </div>

            <textarea
                data-note-field="questions"
                class="special-textarea"
            ></textarea>

        </section>


        <!-- Mistakes Log -->

        <section class="special-card">

            <div class="special-card-header">

                ❌

                <strong>
                    Mistakes Log
                </strong>

            </div>

            <textarea
                data-note-field="mistakes"
                class="special-textarea"
            ></textarea>

        </section>

    </div>


    <!-- =====================================================
         RAPID REVISION SHEET
         ===================================================== -->

    <section class="special-card">

        <div class="special-card-header">

            📝

            <strong>
                Rapid Revision Sheet
            </strong>

        </div>

        <textarea
            data-note-field="content"
            class="special-textarea project-main-editor"
        >{{ page_data.content }}</textarea>

    </section>

</div>
